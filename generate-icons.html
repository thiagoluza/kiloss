    function drawIcon(canvas) {
      const s = canvas.width;
      const ctx = canvas.getContext('2d');

      // Purple rounded rectangle background
      const rx = s * 0.1875;
      ctx.fillStyle = '#5b21b6';
      ctx.beginPath();
      ctx.roundRect(0, 0, s, s, rx);
      ctx.fill();

      // Scale and center the logo path (original viewBox: 872.47 × 237.53)
      const pad = s * 0.125;
      const logoW = s - pad * 2;
      const logoH = logoW * (237.53 / 872.47);
      const tx = pad;
      const ty = (s - logoH) / 2;
      const sc = logoW / 872.47;

      ctx.save();
      ctx.translate(tx, ty);
      ctx.scale(sc, sc);
      ctx.fillStyle = 'white';
      const path = new Path2D(PATH_D);
      ctx.fill(path, 'nonzero');
      ctx.restore();
    }

    const c192 = document.getElementById('c192');
    const c512 = document.getElementById('c512');
    drawIcon(c192);
    drawIcon(c512);

    document.getElementById('btn').onclick = () => {
      [c192, c512].forEach(canvas => {
        const a = document.createElement('a');
        a.download = `icon-${canvas.width}.png`;
        a.href = canvas.toDataURL('image/png');
        a.click();
      });
    };
